<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olentangy Grizzlies 13U Baseball</title>
    <!-- FontAwesome for Social Media Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 114, 206, 0.2);
            margin-bottom: 30px;
            border: 1px solid #1f2833;
        }
        .cta-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #c5c6c7;
            font-weight: 400;
        }
        .btn {
            display: inline-block;
            background-color: #ffb81c; /* Accent yellow from brush stroke */
            color: #000000;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 184, 28, 0.4);
            margin-bottom: 35px;
        }
        .btn:hover {
            background-color: #e09f00;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 184, 28, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
        /* Social Media Section Styling */
        .social-container {
            margin-top: 10px;
            border-top: 1px solid #1f2833;
            padding-top: 25px;
            width: 80%;
        }
        .social-heading {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #667eea; /* Ice blue tint */
            margin-bottom: 15px;
        }
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #1f2833;
            color: #667eea;
            font-size: 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }
        .social-link:hover {
            color: #000000;
            background-color: #ffb81c;
            border-color: #ffb81c;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 184, 28, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Graphic -->
        <img src="grizzlies.jpg" alt="Olentangy Grizzlies 13U Baseball Program - It Is Time" class="logo-img">
        
        <!-- Call to Action -->
        <p class="cta-text">To learn more or register for tryouts, visit our team page:</p>
        
        <a href="https://www.google.com/search?q=2027+Olentangy+Grizzlies+13u" target="_blank" class="btn">2027 Olentangy Grizzlies 13U</a>
        
        <!-- Social Media Links -->
        <div class="social-container">
            <div class="social-heading">Follow the Grizzlies</div>
            <div class="social-icons">
                <a href="https://facebook.com/olentangygrizzlies" target="_blank" class="social-link" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://instagram.com/olentangygrizzlies" target="_blank" class="social-link" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
