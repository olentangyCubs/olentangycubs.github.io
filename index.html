<html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olentangy Grizzlies 13U Baseball</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Montserrat', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .logo-img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 114, 206, 0.2);
            margin-bottom: 30px;
            border: 1px solid #1f2833;
        }
        .cta-text {
            font-size: 1.25rem;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #c5c6c7;
            font-weight: 400;
        }
        .btn {
            display: inline-block;
            background-color: #ffb81c; /* Accent yellow matching the image brush stroke */
            color: #000000;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 184, 28, 0.4);
        }
        .btn:hover {
            background-color: #e09f00;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 184, 28, 0.6);
        }
        .btn:active {
            transform: translateY(1px);
        }
    </style>
